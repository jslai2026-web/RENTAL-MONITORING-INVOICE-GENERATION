main{padding:16px;min-width:0}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.k div,.box{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px}.k small{color:var(--m)}.k b{display:block;font-size:20px;margin-top:4px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--c)}td,th{padding:7px 9px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}th{color:var(--m);font-size:12px}

<div id="intro"><div class="jl"><i></i><span>J</span><span>L</span></div><h1>JL RENTAL MANAGEMENT SYSTEM</h1><button class="s" onclick="skip()">Skip</button></div>
<div id="login" style="display:none"><h2>JL Rental Management</h2><select id="role"><option>ADMIN</option><option>PROPERTY MANAGER</option><option>AUTHORIZED VIEWER</option></select><input id="pin" type="password" placeholder="PIN (first use sets it)"><button onclick="login()">Sign in</button>
<p class="note">Local-device access control only. Real multi-user security and Google Drive sync need a backend/OAuth (see Settings).</p></div>
<div id="app"><nav><b>JL RENTAL</b></nav><main id="v"></main></div>
<input id=xf type=file accept=.xlsx hidden onchange="impX(this)">
<script>
const SEED=[];const $=s=>document.querySelector(s);const K='jlrms1';
const C=x=>Math.round(+x*100),P=c=>(c/100).toLocaleString('en-PH',{style:'currency',currency:'PHP'});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={renters:SEED,invoices:[],payments:[],audit:[],pins:{},rates:{}};
S.maint??=[];S.adv??=[];S.reads??=[];S.rec??={};
let role,tab='Dashboard',mon=new Date().toISOString().slice(0,7);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const log=m=>{S.audit.unshift({t:new Date().toLocaleString(),u:role,m});save()};
const can=a=>({ADMIN:1,'PROPERTY MANAGER':a!='admin','AUTHORIZED VIEWER':a=='view'})[role]&&(role=='ADMIN'||a!='admin');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function skip(){$('#intro').remove();$('#login').style.display='grid'}setTimeout(()=>$('#intro')&&skip(),4300);
async function h(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){const r=$('#role').value,p=await h($('#pin').value);if($('#pin').value.length<4)return alert('PIN needs 4+ characters');
 if(!S.pins[r]){S.pins[r]=p}else if(S.pins[r]!==p)return alert('Wrong PIN');role=r;log('Login');$('#login').remove();$('#app').style.display='grid';
 $('nav').innerHTML+=['Dashboard','Renters','Units','Utilities','Invoices','Payments','Deposits','Maintenance','Analytics','Reports','Audit','Settings'].map(t=>`<a onclick="go('${t}')">${t}</a>`).join('');go('Dashboard')}
function go(t){tab=t;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.textContent==t));$('#v').innerHTML=V[t]();}
const inv=r=>S.invoices.filter(i=>i.rid==r.id);
const paidOn=i=>S.payments.filter(p=>p.inv==i.no).reduce((a,p)=>a+p.c,0);
const status=i=>{const p=paidOn(i);if(p>i.total)return'CREDIT';if(p>=i.total&&i.total>0)return'PAID';if(p>0)return'PARTIALLY';return i.due<new Date().toISOString().slice(0,10)?'OVERDUE':'UNPAID'};
const prevBal=(r,m)=>inv(r).filter(i=>i.final&&i.mon<m).reduce((a,i)=>a+i.total-paidOn(i),0);
function elec(r){if(r.curr!=null&&r.prev!=null){const c=r.curr-r.prev;if(c<0)return null;return{c,amt:C(c*r.rate)}}return{c:null,amt:C(r.sub)}}
function build(r,m){const e=elec(r);if(!e)return null;const [y,mm]=m.split('-'),dd=String(Math.min(r.due,28)).padStart(2,'0');
 const L=[['Previous Balance',prevBal(r,m)],['Rental Fee',C(r.rent)],['Water Charges',0],['Electricity Charges',e.amt],['Maintenance Due',0],['Other Charges',0],['Deposit',0],['Adjustments/Credits',0]];
 return{no:`${r.ref}/TZM-${mm}/${y}`,rid:r.id,mon:m,due:`${m}-${dd}`,issued:new Date().toISOString().slice(0,10),L,note:e.c!=null?`Reading ${r.prev}→${r.curr} = ${e.c} kWh @ ${r.rate}`:'Imported submeter charge (no validated readings)',final:false,total:L.reduce((a,x)=>a+x[1],0)}}
const tot=i=>i.L.reduce((a,x)=>a+x[1],0);
function gen(ids){if(!can('gen'))return alert('Not permitted');let n=0,sk=0;ids.forEach(id=>{const r=S.renters.find(x=>x.id==id);if(S.invoices.find(i=>i.rid==id&&i.mon==mon&&!i.void)){sk++;return}const i=build(r,mon);if(!i){sk++;return}S.invoices.push(i);n++});log(`Generated ${n} draft invoices ${mon}, skipped ${sk}`);go('Invoices');alert(`${n} drafts created, ${sk} skipped (duplicate or invalid reading)`)}
function fin(no){if(!can('gen'))return;const i=S.invoices.find(x=>x.no==no);i.final=true;i.total=tot(i);log('Finalized '+no);go('Invoices')}
function edit(no,k){const i=S.invoices.find(x=>x.no==no);if(i.final)return alert('Finalized invoices cannot be edited. Void and reissue.');const v=prompt(i.L[k][0]+' (PHP)',i.L[k][1]/100);if(v===null||isNaN(v))return;i.L[k][1]=C(v);i.total=tot(i);log(`Edited ${no} ${i.L[k][0]}`);go('Invoices')}
function voidI(no){if(!can('admin'))return alert('Admin only');if(!confirm('Void '+no+'? Payments remain on record.'))return;S.invoices.find(x=>x.no==no).void=true;log('Voided '+no);go('Invoices')}
const W=n=>{const o='zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' '),t='  twenty thirty forty fifty sixty seventy eighty ninety'.split(' ');const f=n=>n<20?o[n]:n<100?t[n/10|0]+(n%10?'-'+o[n%10]:''):n<1e3?o[n/100|0]+' hundred'+(n%100?' '+f(n%100):''):n<1e6?f(n/1e3|0)+' thousand'+(n%1e3?' '+f(n%1e3):''):f(n/1e6|0)+' million'+(n%1e6?' '+f(n%1e6):'');return f(n)};
const words=c=>{c=Math.max(0,c);return W(c/100|0)+' pesos'+(c%100?' and '+W(c%100)+' centavos':'')+' only'};
function pdf(no){const i=S.invoices.find(x=>x.no==no),r=S.renters.find(x=>x.id==i.rid),pd=paidOn(i),w=open('','_blank');if(!w)return alert('Allow popups');
 w.document.write(`<html><head><title>${esc(no)}</title><style>@page{size:A4;margin:12mm}body{font:12px Arial;color:#111}table{width:100%;border-collapse:collapse}td,th{border:1px solid #bbb;padding:5px;text-align:left}.r{text-align:right}h1{margin:0;color:#0b2a6b}.t{background:#0b2a6b;color:#fff;font-size:14px}.f{border-top:2px dashed #888;margin-top:14px;padding-top:8px}</style></head><body>
<h1>JL RENTAL MANAGEMENT</h1><b>MONTHLY RENTAL INVOICE</b> ${i.final?'':'<i>(DRAFT)</i>'}<table style="margin:8px 0"><tr><td>Invoice Ref: <b>${esc(no)}</b></td><td>Issued: ${i.issued}</td><td>Billing: ${i.mon}</td></tr><tr><td>Tenant: <b>${esc(r.name)}</b></td><td>Unit: ${esc(r.unit)}</td><td>Contact: ${esc(r.contact)}</td></tr><tr><td>Contract start: ${r.start||''}</td><td>Due date: <b>${i.due}</b></td><td>Billing type: ${paidOn(i)>0?'Partial/Full per payments':'Full'}</td></tr></table>
<table><tr><th>Item</th><th>Description</th><th class=r>Amount (PHP)</th><th>Remarks</th></tr>${i.L.map((x,k)=>`<tr><td>${k+1}</td><td>${x[0]}</td><td class=r>${P(x[1])}</td><td>${k==3?esc(i.note):''}</td></tr>`).join('')}
<tr class=t><td colspan=2>TOTAL AMOUNT DUE</td><td class=r>${P(i.total)}</td><td></td></tr><tr><td colspan=2>Amount paid</td><td class=r>${P(pd)}</td><td></td></tr><tr><td colspan=2><b>Remaining balance</b></td><td class=r><b>${P(i.total-pd)}</b></td><td>Next due: ${esc(r.due)}th of next month</td></tr></table>
<p><b>Payment instructions:</b> pay on or before due date. <b>Reminders:</b> penalties after grace period per contract; save water and power; no outsiders in common areas.</p><p>Issued by: JL Rental Management. Thank you for being a responsible renter.</p>
<div class=f><b>ACKNOWLEDGEMENT RECEIPT</b><table><tr><td>Received from: ${esc(r.name)} / ${esc(r.unit)}</td><td>Invoice: ${esc(no)}</td></tr><tr><td colspan=2>Amount in words: ${words(pd)}</td></tr><tr><td>Amount: ${P(pd)}</td><td>Method: ${esc(S.payments.filter(p=>p.inv==no).map(p=>p.m).join(', '))}</td></tr><tr><td>Date received: ${S.payments.filter(p=>p.inv==no).map(p=>p.d).join(', ')}</td><td style="height:50px">Received by / signature:</td></tr></table></div></body></html>`);w.document.close();setTimeout(()=>w.print(),400);log('Printed '+no)}
function pay(no){if(!can('pay'))return alert('Not permitted');const a=prompt('Amount received (PHP)');if(a===null||!(+a>0))return;const m=prompt('Method (Cash/GCash/Bank)','GCash')||'',d=prompt('Date paid (YYYY-MM-DD)',new Date().toISOString().slice(0,10)),ref=prompt('Reference no. (optional)')||'';
 S.payments.push({inv:no,c:C(a),m,d,ref});log(`Payment ${a} on ${no}`);go('Payments')}
function saveR(id){if(!can('edit'))return alert('Not permitted');const r=S.renters.find(x=>x.id==id)||{id:prompt('Unit code')||'',ref:'',active:true,rate:19.5,due:1,sub:0,deposit:0};if(!r.id)return;
 r.name=prompt('Name',r.name||'')||r.name;r.contact=prompt('Contact',r.contact||'')||'';r.rent=+prompt('Monthly rent',r.rent||0);r.due=+prompt('Due day (1-31)',r.due)||1;r.unit=r.unit||r.id;r.ref=r.ref||r.id.replace(/\W/g,'').slice(0,5);
 if(!S.renters.includes(r))S.renters.push(r);log('Saved renter '+r.id);go('Renters')}
function arch(id){if(!can('edit'))return;const r=S.renters.find(x=>x.id==id);r.active=!r.active;log((r.active?'Restored ':'Archived ')+id);go('Renters')}
function rd(id){if(!can('edit'))return alert('Not permitted');const r=S.renters.find(x=>x.id==id),p=prompt('Previous reading',r.curr??r.prev??0);if(p===null)return;const c=prompt('Current reading');if(c===null)return;
 if(+c<+p&&!(can('admin')&&confirm('Negative consumption. Authorize meter reset/correction?')))return alert('Rejected: negative consumption');const rt=prompt('Rate per kWh',r.rate);r.prev=+p;r.curr=+c;r.rate=+rt;S.reads.push({id,m:mon,k:+c-+p});log(`Reading ${id} ${p}->${c}`);go('Utilities')}
const act=()=>S.renters.filter(r=>r.active);
const mi=()=>S.invoices.filter(i=>i.mon==mon&&!i.void);
const V={Dashboard(){const A=act(),I=mi(),bill=I.reduce((a,i)=>a+i.total,0),pd=I.reduce((a,i)=>a+paidOn(i),0),od=S.invoices.filter(i=>i.final&&!i.void&&['OVERDUE','UNPAID','PARTIALLY'].includes(status(i))),out=od.reduce((a,i)=>a+i.total-paidOn(i),0),
 soon=A.filter(r=>r.term&&0).length,dues=A.filter(r=>{const d=new Date();const dd=(r.due-d.getDate()+31)%31;return dd<=5}).length,mx=Math.max(1,...A.map(r=>r.rent));
 const al=[];A.forEach(r=>{if(!r.contact||r.contact.includes('TBD'))al.push(`Missing contact: ${esc(r.unit)}`);if(!I.find(i=>i.rid==r.id))al.push(`No ${mon} invoice: ${esc(r.unit)}`);if(r.curr==null)al.push(`No validated meter reading: ${esc(r.unit)}`)});
 return(S.renters.length?'':'<div class=box style="margin-bottom:10px"><b>No renters yet.</b> Admin: open Settings and import MASTER RENTER LIST.xlsx.</div>')+`<div class=row><h2 style="margin:0">Dashboard</h2><input type=month value="${mon}" onchange="mon=this.value;go('Dashboard')"></div><div class=k>${[['Active renters',A.length],['Monthly rent roll',P(A.reduce((a,r)=>a+C(r.rent),0))],['Billed '+mon,P(bill)],['Received',P(pd)],['Outstanding (final invoices)',P(out)],['Overdue invoices',od.filter(i=>status(i)=='OVERDUE').length],['Due within 5 days',dues]].map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>
 <div class=box><b>Monthly rent by unit</b><svg viewBox="0 0 ${A.length*44+10} 140" width="100%">${A.map((r,k)=>{const h=r.rent/mx*100;return`<rect x="${k*44+8}" y="${115-h}" width="32" height="${h}" fill="#0b5fff"/><text x="${k*44+24}" y="130" font-size="9" text-anchor="middle" fill="currentColor">${esc(r.unit)}</text>`}).join('')}</svg></div>
 <div class=box style="margin-top:10px"><b>Alerts</b><div class=note>${al.slice(0,30).join(' · ')||'None'}</div></div>`},
Renters(){return`<div class=row><h2 style="margin:0">Renters</h2><button onclick="saveR('')">+ Add</button></div><div class=w><table><tr><th>Ref</th><th>Unit</th><th>Name</th><th>Contact</th><th>Start</th><th>Due day</th><th>Rent</th><th>Deposit</th><th>Workbook status</th><th>Remarks</th><th></th></tr>${S.renters.map(r=>`<tr style="opacity:${r.active?1:.5}"><td>${esc(r.ref)}</td><td>${esc(r.unit)}</td><td>${esc(r.name)}</td><td>${esc(r.contact)}</td><td>${r.start||''}</td><td>${r.due}</td><td>${P(C(r.rent))}</td><td>${P(C(r.deposit))}</td><td>${esc(r.st1)} / ${esc(r.st2)}</td><td>${esc(r.remarks)} ${esc(r.term)}</td><td><button class=s onclick="saveR('${esc(r.id)}')">Edit</button> <button class=s onclick="arch('${esc(r.id)}')">${r.active?'Archive':'Restore'}</button></td></tr>`).join('')}</table></div>`},
Utilities(){return`<h2>Electricity monitoring</h2><p class=note>Water is waived per workbook. Charge = (current − previous) × rate. Units without reconciling readings use the imported submeter charge until readings are entered.</p><div class=w><table><tr><th>Unit</th><th>Previous</th><th>Current</th><th>kWh</th><th>Rate</th><th>Charge</th><th></th></tr>${act().map(r=>{const e=elec(r);return`<tr><td>${esc(r.unit)}</td><td>${r.prev??'—'}</td><td>${r.curr??'—'}</td><td>${e?.c??'—'}</td><td>${r.rate}</td><td>${e?P(e.amt):'ERR'}</td><td><button class=s onclick="rd('${esc(r.id)}')">Enter reading</button></td></tr>`}).join('')}</table></div>`},
Invoices(){return`<div class=row><h2 style="margin:0">Monthly invoicing</h2><input type=month value="${mon}" onchange="mon=this.value;go('Invoices')"><button onclick="gen(act().map(r=>r.id))">Generate all active</button><select id=one>${act().map(r=>`<option value="${esc(r.id)}">${esc(r.unit)} ${esc(r.name)}</option>`).join('')}</select><button class=s onclick="gen([$('#one').value])">Generate one</button></div><p class=note>Duplicates for the same renter and month are blocked. Finalized invoices are locked; void and reissue to correct.</p><div class=w><table><tr><th>No.</th><th>Unit</th><th>Total</th><th>Paid</th><th>Status</th><th>State</th><th></th></tr>${S.invoices.filter(i=>i.mon==mon).map(i=>{const r=S.renters.find(x=>x.id==i.rid);return`<tr style="opacity:${i.void?.4:1}"><td>${esc(i.no)}</td><td>${esc(r?.unit)}</td><td>${P(i.total)}</td><td>${P(paidOn(i))}</td><td><span class="p ${status(i)}">${status(i)}</span></td><td>${i.void?'VOID':i.final?'FINAL':'DRAFT'}</td><td>${i.void?'':`${i.final?'':`<select onchange="edit('${esc(i.no)}',this.value)"><option value="">Edit line…</option>${i.L.map((x,k)=>`<option value=${k}>${x[0]}</option>`).join('')}</select> <button class=s onclick="fin('${esc(i.no)}')">Finalize</button>`} <button class=s onclick="pdf('${esc(i.no)}')">PDF</button> <button class="s d" onclick="voidI('${esc(i.no)}')">Void</button>`}</td></tr>`}).join('')||'<tr><td colspan=7>No invoices for this month</td></tr>'}</table></div>`},
Payments(){return`<h2>Payments</h2><div class=w><table><tr><th>Invoice</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr>${S.invoices.filter(i=>!i.void).map(i=>`<tr><td>${esc(i.no)}</td><td>${P(i.total)}</td><td>${P(paidOn(i))}</td><td>${P(i.total-paidOn(i))}</td><td><span class="p ${status(i)}">${status(i)}</span></td><td><button onclick="pay('${esc(i.no)}')">Record payment</button></td></tr>`).join('')||'<tr><td colspan=6>Generate an invoice first</td></tr>'}</table></div><h3>History</h3><div class=w><table><tr><th>Date</th><th>Invoice</th><th>Amount</th><th>Method</th><th>Ref</th></tr>${S.payments.map(p=>`<tr><td>${esc(p.d)}</td><td>${esc(p.inv)}</td><td>${P(p.c)}</td><td>${esc(p.m)}</td><td>${esc(p.ref)}</td></tr>`).join('')}</table></div>`},
Reports(){return`<h2>Reports & export</h2><div class=row><button onclick="xl()">Excel: renters, invoices, payments</button><button class=s onclick="doc()">Word: collection statement</button><button class=s onclick="bk()">Backup JSON</button>${can('admin')?'<button class=s onclick="$(\'#f\').click()">Restore backup</button><input id=f type=file accept=.json hidden onchange="rs(this)">':''}</div>`},
Audit(){return`<h2>Audit log</h2><div class=w><table>${S.audit.slice(0,200).map(a=>`<tr><td>${esc(a.t)}</td><td>${esc(a.u)}</td><td>${esc(a.m)}</td></tr>`).join('')}</table></div>`},
Settings(){return`<h2>Settings</h2><div class=box><b>Import workbook</b><p>Load MASTER RENTER LIST.xlsx from your computer. It is read in this browser only and never uploaded.</p><button onclick="$('#xf').click()">Import MASTER RENTER LIST.xlsx</button></div><div class=box style="margin-top:10px"><b>Opening balances</b><p>Imports the workbook's unpaid balances as locked opening invoices dated 2026-10 so the first new invoice carries them forward.</p><button onclick="openBal()">Import workbook balances</button></div><div class=box style="margin-top:10px"><b>Honest limits of this build</b><p>Data and PINs live in this browser only. Roles gate actions on this device but are not server-enforced. Google Drive sync, multi-user conflict handling, and email need a small backend with Google OAuth and are not included. Invoices save as PDF via the browser print dialog. Not yet tested against real operations.</p></div>`}};

const today=()=>new Date().toISOString().slice(0,10),n2=c=>(c/100).toFixed(2);
function addM(){if(!can('edit'))return alert('Not permitted');const u=prompt('Unit code (or COMMON)');if(!u)return;const a=prompt('Amount (PHP)');if(!(+a>0))return;S.maint.push({u,d:today(),desc:prompt('Description')||'',c:C(a)});log('Maintenance '+u+' '+a);go('Maintenance')}
function addA(){if(!can('edit'))return alert('Not permitted');const u=prompt('Unit code');const r=S.renters.find(x=>x.id==u);if(!r)return alert('Unknown unit');const a=prompt('Advance payment (PHP)');if(!(+a>0))return;S.adv.push({rid:u,d:today(),c:C(a),used:0});log('Advance '+u+' '+a);go('Deposits')}
function useA(i){if(!can('pay'))return;const a=S.adv[i],no=prompt('Apply to invoice no.');const inv=S.invoices.find(x=>x.no==no&&!x.void);if(!inv||inv.rid!=a.rid)return alert('Invoice not found for this renter');const amt=Math.min(a.c-a.used,inv.total-paidOn(inv));if(amt<=0)return alert('Nothing to apply');a.used+=amt;S.payments.push({inv:no,c:amt,m:'Advance applied',d:today(),ref:'ADV'});log('Applied advance to '+no);go('Deposits')}
function openBal(){if(!can('admin'))return alert('Admin only');let n=0;S.renters.forEach(r=>{const id='OPEN-'+r.id;if(!r.balX||S.invoices.find(i=>i.no==id))return;const L=['Previous Balance','Rental Fee','Water Charges','Electricity Charges','Maintenance Due','Other Charges','Deposit','Adjustments/Credits'].map(x=>[x,0]);L[r.balX>0?0:7][1]=C(r.balX);S.invoices.push({no:id,rid:r.id,mon:'2026-10',due:'2026-10-31',issued:today(),L,note:'Imported workbook balance',final:true,total:C(r.balX)});n++});log('Imported '+n+' opening balances');go('Settings');alert(n+' opening balances imported')}
const rcs=()=>{const o=[],A=act(),I=S.invoices.filter(i=>i.final&&!i.void),od=I.filter(i=>['OVERDUE','UNPAID','PARTIALLY'].includes(status(i))),d=today();
 od.filter(i=>status(i)=='OVERDUE').forEach(i=>o.push(['HIGH','Overdue invoice '+i.no,`Total ${P(i.total)}, paid ${P(paidOn(i))}, due ${i.due}`,P(i.total-paidOn(i)),'Contact renter and agree a payment date. No penalty is applied automatically.']));
 A.filter(r=>!S.invoices.find(i=>i.rid==r.id&&i.mon==mon&&!i.void)).forEach(r=>o.push(['MEDIUM','No '+mon+' invoice for '+r.unit,'No invoice record this month',P(C(r.rent)),'Generate and review the invoice.']));
 A.filter(r=>!r.contact||r.contact.includes('TBD')).forEach(r=>o.push(['LOW','Missing contact for '+r.unit,'Contact field is empty or TBD','—','Obtain and record contact details.']));
 S.renters.filter(r=>!r.active).forEach(r=>o.push(['MEDIUM','Vacant unit '+r.unit,'Last rent '+P(C(r.rent))+'/month','Up to '+P(C(r.rent))+'/month','Review listing or re-let the unit.']));
 const rd={};S.reads.forEach(x=>(rd[x.id]??=[]).push(x));Object.entries(rd).forEach(([u,a])=>{if(a.length>1){const l=a[a.length-1].k,p=a.slice(0,-1).reduce((s,x)=>s+x.k,0)/(a.length-1);if(p>0&&l>1.5*p)o.push(['MEDIUM','Unusual electricity use in '+u,`Latest ${l.toFixed(1)} kWh vs prior average ${p.toFixed(1)} kWh`,'Not computed','Inspect for leaks, faults or added appliances.'])}});
 const mc={};S.maint.forEach(x=>(mc[x.u]??=[]).push(x));Object.entries(mc).forEach(([u,a])=>{if(a.length>=3)o.push(['LOW','Recurring maintenance at '+u,a.length+' items totalling '+P(a.reduce((s,x)=>s+x.c,0)),'—','Consider preventive maintenance or root-cause repair.'])});
 const late={};S.invoices.filter(i=>i.final&&!i.void).forEach(i=>{const ps=S.payments.filter(p=>p.inv==i.no);if(ps.length&&ps[ps.length-1].d>i.due)late[i.rid]=(late[i.rid]||0)+1});Object.entries(late).forEach(([u,n])=>{if(n>=2)o.push(['MEDIUM','Repeated late payments: '+u,n+' invoices paid after due date','—','Discuss payment schedule at next contact.'])});return o};
const FL=()=>`<input type=month value="${mon}" onchange="mon=this.value;go(tab)">`;
Object.assign(V,{Units(){return`<h2>Units</h2><div class=w><table><tr><th>Unit</th><th>Status</th><th>Renter</th><th>Rent</th><th>Deposit</th></tr>${S.renters.map(r=>`<tr><td>${esc(r.unit)}</td><td><span class="p ${r.active?'PAID':'UNPAID'}">${r.active?'OCCUPIED':'VACANT'}</span></td><td>${r.active?esc(r.name):'—'}</td><td>${P(C(r.rent))}</td><td>${P(C(r.deposit))}</td></tr>`).join('')}</table></div><p class=note>Occupied: ${act().length}. Vacant: ${S.renters.length-act().length}. Archive a renter to mark a unit vacant.</p>`},
Deposits(){const dep=S.renters.filter(r=>r.active).reduce((a,r)=>a+C(r.deposit),0);return`<div class=row><h2 style="margin:0">Deposits & advances</h2><button onclick="addA()">+ Advance payment</button></div><div class=k><div><small>Deposits held (active)</small><b>${P(dep)}</b></div><div><small>Unapplied advances</small><b>${P(S.adv.reduce((a,x)=>a+x.c-x.used,0))}</b></div></div><div class=w><table><tr><th>Unit</th><th>Renter</th><th>Deposit</th></tr>${S.renters.map(r=>`<tr><td>${esc(r.unit)}</td><td>${esc(r.name)}</td><td>${P(C(r.deposit))}</td></tr>`).join('')}</table></div><h3>Advances</h3><div class=w><table><tr><th>Date</th><th>Unit</th><th>Amount</th><th>Applied</th><th></th></tr>${S.adv.map((a,i)=>`<tr><td>${a.d}</td><td>${esc(a.rid)}</td><td>${P(a.c)}</td><td>${P(a.used)}</td><td><button class=s onclick="useA(${i})">Apply to invoice</button></td></tr>`).join('')}</table></div><p class=note>Deposits are not added to invoices unless you edit the Deposit line, so they are not double-counted.</p>`},
Maintenance(){return`<div class=row><h2 style="margin:0">Maintenance</h2><button onclick="addM()">+ Expense</button></div><div class=w><table><tr><th>Date</th><th>Unit</th><th>Description</th><th>Amount</th></tr>${S.maint.map(x=>`<tr><td>${x.d}</td><td>${esc(x.u)}</td><td>${esc(x.desc)}</td><td>${P(x.c)}</td></tr>`).join('')}</table></div><p class=note>Total: ${P(S.maint.reduce((a,x)=>a+x.c,0))}</p>`},
Analytics(){const R=rcs();return`<h2>Analytics & recommendations</h2><p class=note>Rows below are calculated by the system from recorded data. They are suggestions only; nothing changes rent, contracts or penalties automatically.</p><div class=w><table><tr><th>Priority</th><th>Issue</th><th>Supporting data</th><th>Impact</th><th>Action</th><th>Generated</th><th>Status</th></tr>${R.map((x,i)=>{const k=x[1];return`<tr><td><span class="p ${x[0]=='HIGH'?'OVERDUE':x[0]=='MEDIUM'?'PARTIALLY':''}">${x[0]}</span></td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${x[3]}</td><td>${esc(x[4])}</td><td>${today()}</td><td><select onchange="S.rec['${esc(k)}']=this.value;save()">${['OPEN','IN PROGRESS','COMPLETED'].map(o=>`<option ${S.rec[k]==o?'selected':''}>${o}</option>`).join('')}</select></td></tr>`}).join('')||'<tr><td colspan=7>No issues found</td></tr>'}</table></div>`},
Reports(){const f=window.RF||(window.RF={n:'Invoice register',r:''});const rr=S.renters,I=S.invoices.filter(i=>!i.void&&(!f.r||i.rid==f.r)),yr=mon.slice(0,4),
 T={'Master renter list':[['Ref','Unit','Name','Contact','Start','Due day','Rent','Active'],rr.filter(r=>!f.r||r.id==f.r).map(r=>[r.ref,r.unit,r.name,r.contact,r.start,r.due,r.rent,r.active])],
 'Invoice register':[['Invoice','Month','Due','Total','Paid','Status'],I.filter(i=>i.mon==mon).map(i=>[i.no,i.mon,i.due,n2(i.total),n2(paidOn(i)),status(i)])],
 'Outstanding balances':[['Invoice','Unit','Balance'],I.filter(i=>i.final&&i.total>paidOn(i)).map(i=>[i.no,i.rid,n2(i.total-paidOn(i))])],
 'Overdue payments':[['Invoice','Unit','Due','Balance'],I.filter(i=>i.final&&status(i)=='OVERDUE').map(i=>[i.no,i.rid,i.due,n2(i.total-paidOn(i))])],
 'Payment history':[['Date','Invoice','Amount','Method','Ref'],S.payments.filter(p=>!f.r||(S.invoices.find(i=>i.no==p.inv)||{}).rid==f.r).map(p=>[p.d,p.inv,n2(p.c),p.m,p.ref])],
 'Renter ledger':[['Invoice','Billed','Paid','Balance'],I.map(i=>[i.no,n2(i.total),n2(paidOn(i)),n2(i.total-paidOn(i))])],
 'Electricity billing':[['Invoice','Unit','Electricity'],I.filter(i=>i.mon==mon).map(i=>[i.no,i.rid,n2(i.L[3][1])])],
 'Water billing':[['Invoice','Unit','Water'],I.filter(i=>i.mon==mon).map(i=>[i.no,i.rid,n2(i.L[2][1])])],
 'Utility consumption':[['Unit','Month','kWh'],S.reads.filter(x=>!f.r||x.id==f.r).map(x=>[x.id,x.m,x.k.toFixed(2)])],
 'Security deposits':[['Unit','Renter','Deposit'],rr.map(r=>[r.unit,r.name,r.deposit])],
 'Advance payments':[['Unit','Date','Amount','Applied'],S.adv.map(a=>[a.rid,a.d,n2(a.c),n2(a.used)])],
 'Occupancy & vacancy':[['Unit','Status','Rent'],rr.map(r=>[r.unit,r.active?'OCCUPIED':'VACANT',r.rent])],
 'Maintenance expenses':[['Date','Unit','Description','Amount'],S.maint.map(x=>[x.d,x.u,x.desc,n2(x.c)])],
 'Monthly financial summary':[['Month','Billed','Received','Maintenance','Net'],[[mon,n2(I.filter(i=>i.mon==mon).reduce((a,i)=>a+i.total,0)),n2(I.filter(i=>i.mon==mon).reduce((a,i)=>a+paidOn(i),0)),n2(S.maint.filter(x=>x.d.startsWith(mon)).reduce((a,x)=>a+x.c,0)),n2(I.filter(i=>i.mon==mon).reduce((a,i)=>a+paidOn(i),0)-S.maint.filter(x=>x.d.startsWith(mon)).reduce((a,x)=>a+x.c,0))]]],
 'Annual income summary':[['Month','Rent billed','Total billed'],[...new Set(I.filter(i=>i.mon.startsWith(yr)).map(i=>i.mon))].sort().map(m=>[m,n2(I.filter(i=>i.mon==m).reduce((a,i)=>a+i.L[1][1],0)),n2(I.filter(i=>i.mon==m).reduce((a,i)=>a+i.total,0))])]};
 window.RT=T[f.n];return`<h2>Reports & export</h2><div class=row><select onchange="RF.n=this.value;go('Reports')">${Object.keys(T).map(k=>`<option ${k==f.n?'selected':''}>${k}</option>`).join('')}</select>${FL()}<select onchange="RF.r=this.value;go('Reports')"><option value="">All renters</option>${rr.map(r=>`<option value="${esc(r.id)}" ${r.id==f.r?'selected':''}>${esc(r.unit)}</option>`).join('')}</select><button class=s onclick="xr()">Excel</button></div><div class=w><table><tr>${RT[0].map(c=>`<th>${c}</th>`).join('')}</tr>${RT[1].map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||'<tr><td>No data</td></tr>'}</table></div><div class=row style="margin-top:12px"><button onclick="xl()">Excel: all data</button><button class=s onclick="doc()">Word statement</button><button class=s onclick="bk()">Backup JSON</button>${can('admin')?'<button class=s onclick="$(\'#f\').click()">Restore</button><input id=f type=file accept=.json hidden onchange="rs(this)">':''}</div>`}});
function xr(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([RT[0],...RT[1]]),'Report');XLSX.writeFile(wb,'JL_report.xlsx')}
function parseWB(X,wb){const dt=x=>{if(!(x instanceof Date))return null;const z=new Date(x.getTime()+18e5);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const nm=x=>typeof x=='number'?x:0,A=ws=>X.utils.sheet_to_json(ws,{header:1,raw:true}).map(r=>r.filter(c=>c!=null&&c!==''));
const m=wb.Sheets['MASTER RENTER LIST'];if(!m)throw new Error('Sheet "MASTER RENTER LIST" not found');const rows=X.utils.sheet_to_json(m,{header:1,raw:true});const h=rows.findIndex(r=>r&&r[0]=='REF #');if(h<0)throw new Error('Header row "REF #" not found');
const out=[];for(const r of rows.slice(h+1)){if(!r[1]||String(r[1]).startsWith('^'))break;const u=String(r[1]).trim();let rate=19.5,pv=0,cv=0,dep=0;
 const sn=wb.SheetNames.find(n=>n.split('_')[0]==u&&!n.startsWith('Copy'));
 if(sn){const R=A(wb.Sheets[sn]);R.forEach((x,k)=>{if(x[0]=='Rate'&&R[k+1]){const n=R[k+1].filter(c=>typeof c=='number');if(n.length)rate=n[0]}
  if(x.includes('reading>')){const n=x.filter(c=>typeof c=='number');if(n.length>=2){pv=n[n.length-2];cv=n[n.length-1]}}
  if(x.includes('Deposit:')){const n=x.slice(x.indexOf('Deposit:')+1).filter(c=>typeof c=='number');if(n.length)dep=n[0]}})}
 const sub=nm(r[9]);if(Math.abs((cv-pv)*rate-sub)>.5){pv=cv=null}
 out.push({id:u,ref:r[0],unit:u,name:String(r[2]??'').trim(),contact:String(r[3]??'').trim(),start:dt(r[4]),due:Math.trunc(nm(r[5]))||1,rent:nm(r[8]),sub,paidX:nm(r[11]),paidNote:String(r[12]??''),balX:nm(r[13]),st1:String(r[14]??''),st2:String(r[15]??''),remarks:String(r[16]??''),term:String(r[17]??''),rate,prev:pv,curr:cv,deposit:dep,maint:199,active:true})}
return out}
function impX(inp){if(!can('admin')){inp.value='';return alert('Admin only')}const f=inp.files[0];if(!f)return;f.arrayBuffer().then(b=>{let R;try{R=parseWB(XLSX,XLSX.read(b,{cellDates:true}))}catch(e){return alert(e.message)}
 if(!R.length)return alert('No renters found');if(!confirm('Import '+R.length+' renters? This replaces the renter list (invoices and payments are kept).'))return;S.renters=R;log('Imported workbook: '+R.length+' renters');inp.value='';go('Renters')})}
function xl(){if(!can('export'))return alert('Not permitted');const wb=XLSX.utils.book_new(),f=a=>XLSX.utils.json_to_sheet(a);XLSX.utils.book_append_sheet(wb,f(S.renters),'Renters');XLSX.utils.book_append_sheet(wb,f(S.invoices.map(i=>({no:i.no,mon:i.mon,due:i.due,total:i.total/100,paid:paidOn(i)/100,status:status(i)}))),'Invoices');XLSX.utils.book_append_sheet(wb,f(S.payments.map(p=>({...p,c:p.c/100}))),'Payments');XLSX.writeFile(wb,'JL_Rental_Export.xlsx');log('Excel export')}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function doc(){const rows=S.invoices.filter(i=>!i.void).map(i=>`<tr><td>${esc(i.no)}</td><td>${P(i.total)}</td><td>${P(paidOn(i))}</td><td>${P(i.total-paidOn(i))}</td><td>${status(i)}</td></tr>`).join('');dl('JL_Collection_Statement.doc',`<html><body><h1>JL Rental Management – Collection Statement</h1><table border=1 cellpadding=4><tr><th>Invoice</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th></tr>${rows}</table></body></html>`,'application/msword');log('Word export')}
function bk(){if(!can('admin'))return alert('Admin only');dl('JL_backup_'+Date.now()+'.json',JSON.stringify(S),'application/json');log('Backup')}
function rs(el){const f=el.files[0];if(!f||!confirm('Replace all data with this backup?'))return;f.text().then(t=>{bk();S=JSON.parse(t);log('Restore');save();go('Dashboard')})}
</script></body></html>
